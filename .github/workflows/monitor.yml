name: 꼴로르 L사이즈 재고 알림

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "텔레그램 테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: ccolore-monitor-${{ inputs.test == true && 'test' || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 재고 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL_SEC: "30"
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python ccolore_monitor.py --test
          else
            python ccolore_monitor.py --minutes 345
          fi
      - name: 다음 감시 이어서 시작
        if: ${{ !cancelled() && inputs.test != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref ${{ github.ref_name }}
